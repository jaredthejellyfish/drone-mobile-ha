[project]
name = "homeassistant-dronemobile"
version = "0.1.0"
description = "DroneMobile custom integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "drone-mobile==0.4.1",
]

[dependency-groups]
dev = [
    "homeassistant==2026.8.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
